# Credentials live in the platform's secret store; External Secrets Operator materialises them as Kubernetes Secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quellbrook-notifier-db
  namespace: quellbrook-notifier
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: quellbrook-vault
  target:
    name: quellbrook-notifier-db
  data:
    - secretKey: connection-string
      remoteRef:
        key: notifier/postgres
        property: connection-string
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quellbrook-notifier-broker
  namespace: quellbrook-notifier
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: quellbrook-vault
  target:
    name: quellbrook-notifier-broker
  data:
    - secretKey: username
      remoteRef:
        key: notifier/rabbitmq
        property: username
    - secretKey: password
      remoteRef:
        key: notifier/rabbitmq
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quellbrook-notifier-providers
  namespace: quellbrook-notifier
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: quellbrook-vault
  target:
    name: quellbrook-notifier-providers
  data:
    - secretKey: email-api-key
      remoteRef:
        key: notifier/email-provider
        property: api-key
    - secretKey: sms-api-key
      remoteRef:
        key: notifier/sms-gateway
        property: api-key
