apiVersion: v1
kind: ServiceAccount
metadata:
  name: quellbrook-notifier
  namespace: quellbrook-notifier
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quellbrook-notifier
  namespace: quellbrook-notifier
  labels:
    app.kubernetes.io/name: quellbrook-notifier
    app.kubernetes.io/part-of: quellbrook
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quellbrook-notifier
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app.kubernetes.io/name: quellbrook-notifier
        app.kubernetes.io/part-of: quellbrook
    spec:
      serviceAccountName: quellbrook-notifier
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/code-assurance-initiative/quellbrook-notifier@sha256:bee769e4eafdb6d93c28d7bf780d5f2cc83091859b8458835b0aa4ae75448aa5
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4317
            - name: ConnectionStrings__Notifier
              valueFrom:
                secretKeyRef:
                  name: quellbrook-notifier-db
                  key: connection-string
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: quellbrook-notifier-broker
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: quellbrook-notifier-broker
                  key: password
            - name: EmailProvider__ApiKey
              valueFrom:
                secretKeyRef:
                  name: quellbrook-notifier-providers
                  key: email-api-key
            - name: SmsProvider__ApiKey
              valueFrom:
                secretKeyRef:
                  name: quellbrook-notifier-providers
                  key: sms-api-key
          # The heartbeat file is rewritten after every health-check round that is not Unhealthy (every 30 s).
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "find /tmp/heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 40
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "find /tmp/heartbeat -mmin -5 | grep -q ."]
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
