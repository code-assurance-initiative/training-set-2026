name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so advisories published against the locked dependency sets show up even when nobody has pushed.
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (from the lock file)
        run: npm ci

      - name: Dependency report (advisories, outdated)
        run: |
          {
            echo '### Service dependency report'
            echo '```'
            npm audit || true
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test with coverage thresholds
        run: npm run test:coverage

  manifest-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/manifest-export
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/manifest-export/package-lock.json

      - name: Install (from the lock file)
        run: npm ci

      - name: Dependency report (advisories, outdated)
        run: |
          {
            echo '### manifest-export dependency report'
            echo '```'
            npm audit || true
            npm outdated || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: npm test
