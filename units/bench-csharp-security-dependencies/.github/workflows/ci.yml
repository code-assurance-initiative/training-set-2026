name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so advisories published against the locked dependency set show up even when nobody has pushed.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Invoicing.slnx --locked-mode

      - name: Dependency report (vulnerable, deprecated, outdated)
        run: |
          {
            echo '### Dependency report'
            echo '```'
            dotnet list Invoicing.slnx package --vulnerable --include-transitive
            dotnet list Invoicing.slnx package --deprecated
            dotnet list Invoicing.slnx package --outdated
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: dotnet build Invoicing.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Invoicing.slnx -c Release --no-build
