name: Release

on:
  push:
    tags: ["v*"]

permissions: write-all

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image: [api, reminders]
    env:
      IMAGE: ghcr.io/depot-slots/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Build and push
        env:
          DOCKERFILE: ${{ matrix.image == 'api' && 'src/Depot.Slots.Api/Dockerfile' || 'src/Depot.Slots.Reminders/Dockerfile' }}
        run: |
          docker buildx build . \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            --provenance=false \
            --push
