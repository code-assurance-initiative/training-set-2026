name: PR preview image

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build and push the preview image
        env:
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker build . --file src/Depot.Slots.Api/Dockerfile --tag "ghcr.io/depot-slots/api-preview:$TAG"
          docker push "ghcr.io/depot-slots/api-preview:$TAG"

      - name: Comment the image tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: 'gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Preview image: \`ghcr.io/depot-slots/api-preview:pr-$PR\`"'
