name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Label by dock or component
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          title="${{ github.event.issue.title }}"
          if echo "$title" | grep -qiE '\bdock ?[A-Z]?[0-9]{1,2}\b'; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "dock-schedule"
          fi
          if echo "$title" | grep -qi 'reminder'; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "reminders"
          fi
