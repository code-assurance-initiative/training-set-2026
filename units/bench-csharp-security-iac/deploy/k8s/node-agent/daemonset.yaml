apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: depot-slots
  labels:
    app.kubernetes.io/name: node-agent
    app.kubernetes.io/part-of: depot-slots
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-agent
        app.kubernetes.io/part-of: depot-slots
    spec:
      serviceAccountName: node-agent
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:latest
          args: ["--config=/fluent-bit/etc/fluent-bit.yaml"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - name: http
              containerPort: 2020
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: containerd
              mountPath: /run/containerd/containerd.sock
      volumes:
        - name: config
          configMap:
            name: node-agent-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: containerd
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
