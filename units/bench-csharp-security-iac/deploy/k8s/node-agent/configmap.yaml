apiVersion: v1
kind: ConfigMap
metadata:
  name: node-agent-config
  namespace: depot-slots
data:
  fluent-bit.yaml: |
    service:
      flush: 5
      log_level: info
      http_server: on
      http_listen: 0.0.0.0
      http_port: 2020
      health_check: on
    pipeline:
      inputs:
        - name: tail
          path: /var/log/containers/depot-slots-*.log
          parser: cri
          tag: kube.*
      filters:
        - name: kubernetes
          match: kube.*
          kube_tag_prefix: kube.var.log.containers.
      outputs:
        - name: forward
          match: "*"
          host: logs.platform.internal
          port: 24224
          tls: on
          tls.verify: on
