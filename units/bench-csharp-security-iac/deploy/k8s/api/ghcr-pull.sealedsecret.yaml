# Registry pull credential, encrypted with the cluster's sealed-secrets public key. Only the
# controller in the cluster holds the private key that can decrypt it.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: depot-slots
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: depot-slots
    type: kubernetes.io/dockerconfigjson
