apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: depot-slots-api
  namespace: depot-slots
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64k
spec:
  ingressClassName: nginx
  rules:
    - host: slots.depot.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: depot-slots-api
                port:
                  name: http
