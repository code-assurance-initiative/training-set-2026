# The database connection string lives in the platform's secret store; the operator writes it into
# the depot-slots-db Secret, which the API and the reminder worker read through secretKeyRef.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: depot-slots-db
  namespace: depot-slots
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-vault
  target:
    name: depot-slots-db
    creationPolicy: Owner
  data:
    - secretKey: connection-string
      remoteRef:
        key: depot/slots/postgres
        property: connection-string
