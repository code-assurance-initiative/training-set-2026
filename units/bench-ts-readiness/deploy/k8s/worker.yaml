apiVersion: v1
kind: ServiceAccount
metadata:
  name: parcel-tracking-worker
  namespace: parcel-tracking
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-tracking-worker
  namespace: parcel-tracking
  labels:
    app.kubernetes.io/name: parcel-tracking-worker
    app.kubernetes.io/part-of: parcel-tracking
spec:
  # One poller: two would poll every parcel twice and race on the outbox.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: parcel-tracking-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parcel-tracking-worker
        app.kubernetes.io/part-of: parcel-tracking
    spec:
      serviceAccountName: parcel-tracking-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/code-assurance-initiative/parcel-tracking@sha256:45ccd8b9bd08d1b206595f2f92c940f458b61b9b6287a2dafc2b905a628d9932
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker/main.js"]
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: CARRIER_API_URL
              value: https://carrier-gateway.parcels.example/
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-db
                  key: url
            - name: CARRIER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-carriers
                  key: api-key
            - name: WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-webhooks
                  key: signing-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 30
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
