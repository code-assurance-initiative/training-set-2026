apiVersion: v1
kind: ServiceAccount
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
  labels:
    app.kubernetes.io/name: parcel-tracking-api
    app.kubernetes.io/part-of: parcel-tracking
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parcel-tracking-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parcel-tracking-api
        app.kubernetes.io/part-of: parcel-tracking
    spec:
      serviceAccountName: parcel-tracking-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/code-assurance-initiative/parcel-tracking@sha256:45ccd8b9bd08d1b206595f2f92c940f458b61b9b6287a2dafc2b905a628d9932
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/api/main.js"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PUBLIC_BASE_URL
              value: https://tracking.parcels.example
            - name: JWT_ISSUER
              value: https://login.parcels.example/realms/merchants
            - name: JWT_AUDIENCE
              value: parcel-tracking
            - name: JWT_PUBLIC_KEY
              valueFrom:
                configMapKeyRef:
                  name: parcel-tracking-token-issuer
                  key: public-key.pem
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-db
                  key: url
            - name: LINK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-links
                  key: signing-key
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
spec:
  selector:
    app.kubernetes.io/name: parcel-tracking-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: parcel-tracking-api
