name: Release packages

# client-v* publishes @parcel-tracking/client, webhooks-v* publishes @parcel-tracking/webhooks, each with npm
# provenance. The tag must match the version in the package's manifest.
on:
  push:
    tags: ["client-v*.*.*", "webhooks-v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publishing waits for a maintainer's approval of the run (required reviewers on the npm environment).
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install (from the lock file)
        run: npm ci

      - name: Select the package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            client-v*) dir=packages/tracking-client ;;
            webhooks-v*) dir=packages/webhooks ;;
          esac
          version="$(node -p "require('./$dir/package.json').version")"
          [ "${TAG#*-v}" = "$version" ] || { echo "tag $TAG does not match $dir version $version"; exit 1; }
          echo "PACKAGE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          npm test
          npm run build --workspace "$PACKAGE_DIR"

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace "$PACKAGE_DIR" --provenance --access public
