name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories against the locked dependency set fail the build
    # even when nobody has pushed.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (from the lock file)
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=low
          npm audit signatures

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build every workspace
        run: npm run build

      - name: Unit and integration tests with coverage thresholds
        run: npm run test:coverage

      - name: Specifications (tracking)
        run: npm run test:bdd

      - name: Specifications (webhooks)
        run: npm run test:bdd:webhooks

      - name: Package contents
        run: |
          npm pack --dry-run --workspace packages/tracking-client
          npm pack --dry-run --workspace packages/webhooks
