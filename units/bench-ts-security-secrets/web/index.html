<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Upload media</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css"
      integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" crossorigin="anonymous" />
  </head>
  <body>
    <main class="container">
      <h1>Upload media</h1>
      <form id="upload-form">
        <label for="owner">Workspace</label>
        <input id="owner" name="owner" required pattern="[a-z0-9][a-z0-9_-]{2,63}" autocomplete="organization" />
        <label for="file">File</label>
        <input id="file" name="file" type="file" required accept="image/*,video/mp4,video/quicktime,application/pdf" />
        <label for="email">E-mail me when it is ready (optional)</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <button type="submit">Upload</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="plan-heading">
        <h2 id="plan-heading">Storage plan</h2>
        <div id="payment-element"></div>
        <button id="upgrade" type="button">Upgrade to 1 TB</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
