services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://media:postgres@db:5432/media
      OBJECTSTORE_ACCESS_KEY_ID: ${OBJECTSTORE_ACCESS_KEY_ID}
      OBJECTSTORE_SECRET_ACCESS_KEY: ${OBJECTSTORE_SECRET_ACCESS_KEY}
      STRIPE_RESTRICTED_KEY: ${STRIPE_RESTRICTED_KEY}
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    # postgres:17-alpine
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media"]
      interval: 5s
      timeout: 3s
      retries: 10
