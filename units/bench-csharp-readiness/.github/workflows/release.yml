name: Release

# A version tag builds both images (pushed by digest), the EF Core migrations bundle and the client package, and
# attaches the bundle, the package, their SHA-256 checksums (with build-provenance attestations) and the image digests
# to a GitHub release. Deploying is a separate, manual step
# (deploy.yml).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      DOTNET_NOLOGO: true
      ContinuousIntegrationBuild: true
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked) and tools
        run: |
          dotnet restore ParcelTracking.slnx --locked-mode
          dotnet tool restore

      - name: Build migrations bundle
        run: >-
          dotnet ef migrations bundle
          --project src/ParcelTracking.Infrastructure
          --startup-project src/ParcelTracking.Infrastructure
          --configuration Release
          --self-contained --target-runtime linux-x64
          --output artifacts/efbundle

      - name: Pack client library
        run: dotnet pack src/ParcelTracking.Client -c Release --no-restore -p:Version="${VERSION#v}" -o artifacts

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/ParcelTracking.Api/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/code-assurance-initiative/parcel-tracking-api:${{ github.ref_name }}

      - name: Build and push worker image
        id: worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/ParcelTracking.Worker/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/code-assurance-initiative/parcel-tracking-worker:${{ github.ref_name }}

      - name: Checksums for the release files
        run: |
          cd artifacts
          sha256sum efbundle *.nupkg > SHA256SUMS

      - name: Attest build provenance of the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/efbundle
            artifacts/*.nupkg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          printf 'api=%s\nworker=%s\n' "$API_DIGEST" "$WORKER_DIGEST" > artifacts/image-digests.txt
          gh release create "$VERSION" artifacts/efbundle artifacts/*.nupkg artifacts/SHA256SUMS artifacts/image-digests.txt \
            --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file CHANGELOG.md
