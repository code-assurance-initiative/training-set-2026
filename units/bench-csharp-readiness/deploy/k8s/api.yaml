apiVersion: v1
kind: ServiceAccount
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
  labels:
    app.kubernetes.io/name: parcel-tracking-api
    app.kubernetes.io/part-of: parcel-tracking
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parcel-tracking-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parcel-tracking-api
        app.kubernetes.io/part-of: parcel-tracking
    spec:
      serviceAccountName: parcel-tracking-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/code-assurance-initiative/parcel-tracking-api@sha256:7ecca99a70318a9844500498ce2ce6b02f8cbd4114aad09b559478fe591da9f7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: Authentication__Authority
              value: https://login.parcels.internal/realms/merchants
            - name: ForwardedHeaders__TrustedNetwork
              value: 10.42.0.0/16
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4317
            - name: ConnectionStrings__Tracking
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-db
                  key: connection-string
            - name: CarrierApi__ApiKey
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-carrier-api
                  key: api-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
spec:
  selector:
    app.kubernetes.io/name: parcel-tracking-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: parcel-tracking-api
  namespace: parcel-tracking
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: parcel-tracking-api
