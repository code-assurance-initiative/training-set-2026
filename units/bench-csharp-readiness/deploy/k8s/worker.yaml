apiVersion: v1
kind: ServiceAccount
metadata:
  name: parcel-tracking-worker
  namespace: parcel-tracking
automountServiceAccountToken: false
---
# One replica, replaced (not rolled): two pollers would poll every parcel twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-tracking-worker
  namespace: parcel-tracking
  labels:
    app.kubernetes.io/name: parcel-tracking-worker
    app.kubernetes.io/part-of: parcel-tracking
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: parcel-tracking-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parcel-tracking-worker
        app.kubernetes.io/part-of: parcel-tracking
    spec:
      serviceAccountName: parcel-tracking-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/code-assurance-initiative/parcel-tracking-worker@sha256:93392c923813559e1e40b6ca89db767872cd068798737190427b2e8adb96590d
          imagePullPolicy: IfNotPresent
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4317
            - name: ConnectionStrings__Tracking
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-db
                  key: connection-string
            - name: CarrierApi__ApiKey
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-carrier-api
                  key: api-key
            - name: MerchantWebhooks__SigningKey
              valueFrom:
                secretKeyRef:
                  name: parcel-tracking-webhooks
                  key: signing-key
          # The heartbeat file is rewritten after every health-check round that is not Unhealthy (every 30 s).
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "find /tmp/heartbeat -mmin -2 | grep -q ."]
            initialDelaySeconds: 40
            periodSeconds: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "find /tmp/heartbeat -mmin -5 | grep -q ."]
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
